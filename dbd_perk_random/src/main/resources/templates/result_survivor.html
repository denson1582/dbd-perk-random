<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>S-Randomizer | Result</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { background: #0f172a; color: white; font-family: 'Noto Sans JP', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
    .container { max-width: 500px; width: 100%; }
    .header { font-family: 'Teko', sans-serif; font-size: 3.5rem; color: #3498db; text-align: center; margin-bottom: 20px; }
    .card { background: rgba(255, 255, 255, 0.05); border-left: 5px solid #3498db; margin-bottom: 15px; padding: 18px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .p-info { display: flex; flex-direction: column; }
    .p-cat { font-size: 0.75rem; color: #3498db; text-transform: uppercase; margin-bottom: 4px; }
    .p-name { font-size: 1.3rem; font-weight: bold; }
    .p-stars { font-family: 'Teko', sans-serif; font-size: 2rem; color: #f1c40f; }
    .footer { display: flex; justify-content: center; gap: 15px; margin-top: 30px; flex-wrap: wrap; }
    .btn-ui { display: inline-block; background: #333; color: white; text-decoration: none; padding: 12px 30px; border-radius: 4px; font-size: 1rem; border: none; cursor: pointer; }
    .btn-primary { background: #3498db; font-weight: bold; font-family: 'Teko', sans-serif; font-size: 1.5rem; }
    .btn-reset { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #888; font-size: 0.8rem; width: 100%; margin-top: 10px; }
    .container { padding-top: 100px; /* ナビゲーションの高さ分だけ下にずらす */ }
  </style>
</head>
<body>
<div class="container">
  <div class="header">SURVIVOR PERKS</div>
  <div th:each="p : ${survivorPerks}" class="card">
    <div class="p-info">
      <span class="p-cat" th:text="${p.category.name}">CATEGORY</span>
      <span class="p-name" th:text="${p.name}">PERK NAME</span>
    </div>
    <div class="p-stars" th:text="'★' + ${p.stars}">★3</div>
  </div>
  <div class="footer">
    <a href="/survivor" class="btn-ui">戻る</a>
    <form th:action="@{/survivor/draw}" method="post">
      <button type="submit" class="btn-ui btn-primary">もう一度抽選</button>
    </form>
    <form th:action="@{/survivor/reset}" method="post" style="width: 100%;">
      <button type="submit" class="btn-ui btn-reset">当選履歴をリセットして全パークを対象にする</button>
    </form>
  </div>
</div>
</body>
</html>
