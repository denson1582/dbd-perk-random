<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500&display=swap" rel="stylesheet">
  <style>
    body { background: #0a0a0a; color: #ddd; font-family: sans-serif; margin: 0; padding-top: 80px; }
    .header-area { text-align: center; padding: 20px; }
    .header-area h1 { font-family: 'Teko'; font-size: 3rem; color: #f1c40f; margin: 0; }
    .search-container { position: sticky; top: 70px; background: #0a0a0a; padding: 20px; z-index: 10; display: flex; justify-content: center; }
    .search-box { width: 80%; max-width: 600px; padding: 15px; background: #111; border: 1px solid #333; color: white; border-radius: 5px; }
    .perk-table { width: 90%; max-width: 1000px; margin: 0 auto; border-collapse: collapse; }
    .perk-table tr { border-bottom: 1px solid #222; transition: 0.2s; }
    .perk-table tr:hover { background: rgba(255,255,255,0.02); }
    .perk-table td { padding: 15px; }
    .btn-toggle { padding: 8px 20px; border-radius: 3px; border: none; font-family: 'Teko'; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
    .btn-on { background: #27ae60; color: white; }
    .btn-off { background: #444; color: #888; }
    .excluded-row { opacity: 0.4; background: #050505 !important; }
    .container { padding-top: 100px; /* ナビゲーションの高さ分だけ下にずらす */ }
  </style>
</head>
<body>
<nav style="width: 100%; background: #000; border-bottom: 1px solid #333; padding: 15px 0; display: flex; justify-content: center; gap: 40px; position: fixed; top: 0; z-index: 100;">
  <a th:href="@{/}" style="color: #888; text-decoration: none; font-family: 'Teko'; font-size: 1.5rem;">TOP</a>
  <a th:href="@{/survivor}" style="color: #3498db; text-decoration: none; font-family: 'Teko'; font-size: 1.5rem;">SURVIVOR</a>
  <a th:href="@{/killer}" style="color: #e74c3c; text-decoration: none; font-family: 'Teko'; font-size: 1.5rem;">KILLER</a>
  <a th:href="@{/admin}" style="color: #f1c40f; text-decoration: none; font-family: 'Teko'; font-size: 1.5rem;">ADMIN</a>
</nav>

<div class="header-area">
  <h1>PERK SETTINGS</h1>
</div>

<div class="search-container">
  <input type="text" id="q" class="search-box" placeholder="SEARCH PERK NAME...">
</div>

<table class="perk-table">
  <tbody id="t">
  <tr th:each="p : ${allPerks}" th:classappend="${p.isExcluded} ? 'excluded-row'">
    <td th:text="${p.role}" th:style="${p.role.name() == 'SURVIVOR'} ? 'color:#3498db' : 'color:#e74c3c'"></td>
    <td th:text="${p.name}" style="font-weight: bold; font-size: 1.1rem;"></td>
    <td th:text="${p.category.name}" style="color: #666; font-size: 0.8rem;"></td>
    <td align="right">
      <form th:action="@{/admin/toggle/{id}(id=${p.id})}" method="post">
        <button type="submit" class="btn-toggle" th:classappend="${p.isExcluded} ? 'btn-off' : 'btn-on'"
                th:text="${p.isExcluded} ? 'DISABLED' : 'ENABLED'"></button>
      </form>
    </td>
  </tr>
  </tbody>
</table>

<script>
  document.getElementById('q').addEventListener('input', e => {
      const v = e.target.value.toLowerCase();
      document.querySelectorAll('#t tr').forEach(r => {
          const name = r.children[1].innerText.toLowerCase();
          r.style.display = name.includes(v) ? '' : 'none';
      });
  });
</script>
</body>
</html>
